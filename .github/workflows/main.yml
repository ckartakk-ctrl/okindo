name: Android APK

# Koda her değişiklik yüklendiğinde (ya da Actions sekmesinden "Run workflow" ile) APK derlenir.
# Bitince APK, deponun "Releases" bölümüne telefondan indirilebilir şekilde konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Supabase anahtarlarını yaz
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL ve SUPABASE_KEY eklenmemiş (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env

      - name: Paketleri kur
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Kod kontrolü (yalnız uyarı)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Android projesini oluştur
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee prebuild.log

      - name: APK derle
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log

      # Hata olursa son satırları, Actions sayfasındaki "Annotations" bölümüne yazar
      - name: Hata özetini göster
        if: failure()
        run: |
          for f in prebuild.log gradle.log; do
            [ -f "$f" ] || continue
            ozet=$(grep -n -i -E "error|what went wrong|failed|exception|cannot|could not" "$f" | tail -40)
            [ -n "$ozet" ] || ozet=$(tail -40 "$f")
            ozet=$(printf '%s' "$ozet" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$ozet"
            son=$(tail -25 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f (son satırlar)::$son"
          done

      - name: APK'yı Releases bölümüne koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk okindo.apk
          gh release create "apk-${{ github.run_number }}" okindo.apk \
            --title "okindo APK #${{ github.run_number }}" \
            --notes "Telefona kurmak için aşağıdaki okindo.apk dosyasına dokun." \
            --latest
