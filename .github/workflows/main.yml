name: Android APK

# Koda her değişiklik yüklendiğinde (ya da Actions sekmesinden "Run workflow" ile) APK derlenir.
# Bitince APK, deponun "Releases" bölümüne telefondan indirilebilir şekilde konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Supabase okindo projesi (Frankfurt). Bu anahtar herkese açık "anon" anahtarıdır;
    # uygulamanın içine zaten gömülür, veriler veritabanındaki erişim kurallarıyla korunur.
    # Gizli "service_role" anahtarı ASLA buraya yazılmaz.
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://taqrdphgahadaiageaon.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcXJkcGhnYWhhZGFpYWdlYW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTUzNTgsImV4cCI6MjEwODkzMTM1OH0.pCeOZ4DokVK5LQ4GLrZLMHLKvGSTJiMKvlXzedINKtw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Supabase anahtarlarını yaz
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase adresi ya da anahtarı eksik"
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env

      - name: Paketleri kur
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Kod kontrolü (yalnız uyarı)
        continue-on-error: true
        run: |
          if ! npx tsc --noEmit > tsc.log 2>&1; then
            echo "::warning title=Tip kontrolü::$(head -40 tsc.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: Android projesini oluştur
        run: |
          set -o pipefail
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee prebuild.log
          # Derleme belleği ve hedef işlemciler (x86 eski, gerek yok)
          sed -i '/^org.gradle.jvmargs=/d;/^reactNativeArchitectures=/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> android/gradle.properties
          echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64' >> android/gradle.properties

      - name: APK derle
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.jvmargs=-Xmx6g
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          cd android
          echo "::notice title=gradle.properties::$(grep -E 'jvmargs|Architectures' gradle.properties | tr '\n' ' ')"
          ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" 2>&1 | tee ../gradle.log

      # Hata olursa son satırları, Actions sayfasındaki "Annotations" bölümüne yazar
      - name: Hata özetini göster
        if: failure()
        run: |
          for f in prebuild.log gradle.log; do
            [ -f "$f" ] || continue
            ozet=$(grep -n -i -E "error|what went wrong|failed|exception|cannot|could not" "$f" | tail -40)
            [ -n "$ozet" ] || ozet=$(tail -40 "$f")
            ozet=$(printf '%s' "$ozet" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$ozet"
            son=$(tail -25 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f (son satırlar)::$son"
          done

      - name: APK'yı hazırla
        run: cp android/app/build/outputs/apk/release/app-release.apk okindo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: okindo-apk
          path: okindo.apk

  # Web önizlemesini derler, test hesaplarıyla girip her ekranın görüntüsünü alır,
  # görüntüleri "ekranlar" dalına yazar (tasarım denetimi için). APK'yı etkilemez.
  ekranlar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://taqrdphgahadaiageaon.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcXJkcGhnYWhhZGFpYWdlYW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTUzNTgsImV4cCI6MjEwODkzMTM1OH0.pCeOZ4DokVK5LQ4GLrZLMHLKvGSTJiMKvlXzedINKtw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web önizlemesini derle
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env
          npm install --no-audit --no-fund
          npx expo install react-native-web react-dom @expo/metro-runtime
          echo "::notice title=Yazı tipi paketi::$(ls node_modules/@expo-google-fonts/bricolage-grotesque | tr '\n' ' ' | cut -c1-900) | index: $(grep -o 'BricolageGrotesque_[A-Za-z0-9_]*600[A-Za-z]*' node_modules/@expo-google-fonts/bricolage-grotesque/index.js | sort -u | tr '\n' ' ')" || true
          set -o pipefail
          npx expo export --platform web --output-dir web-dist 2>&1 | tee web.log | tail -20 || {
            echo "::error title=Web derleme::$(grep -i -E 'error|unable|cannot' web.log | tail -15 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - name: Ekran görüntülerini al
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/statik_sunucu.mjs web-dist 8099 &
          sleep 2
          node tests/ekran_goruntuleri.mjs http://localhost:8099 ekran-cikti
      - name: Görüntüleri "ekranlar" dalına yaz
        if: always()
        run: |
          [ -d ekran-cikti ] || exit 0
          cd ekran-cikti
          git init -q -b ekranlar
          git config user.name "okindo-ci"
          git config user.email "ci@okindo.local"
          echo "Derleme: ${{ github.sha }}" > KAYNAK.txt
          git add -A
          git commit -q -m "Ekran görüntüleri ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ekranlar:ekranlar
          echo "::notice title=Ekranlar::$(tr '\n' ' ' < rapor.txt | cut -c1-900)"

  # Sanal bir Android telefonda APK'yı kurup açar; çökerse sebebi Annotations'a yazılır.
  acilis-testi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: okindo-apk

      - name: Sanal telefon için KVM'yi aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK'yı sanal telefonda aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r okindo.apk
            adb logcat -c
            adb shell monkey -p com.okindo.app -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell pidof com.okindo.app > pid.txt || true
            adb logcat -d > logcat.txt
            adb exec-out uiautomator dump /dev/tty > ekran.xml || true

      - name: Sonucu yaz
        if: always()
        run: |
          kacis() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if [ -s pid.txt ]; then
            echo "::notice title=Açılış testi::Uygulama 30 saniye sonra hâlâ çalışıyor (pid $(cat pid.txt))"
          else
            echo "::error title=Açılış testi::Uygulama 30 saniye içinde kapandı"
            echo "kapandi" > sonuc.txt
          fi
          if [ -f logcat.txt ]; then
            cokme=$(grep -n -A 45 -E "FATAL EXCEPTION|Fatal signal|SoLoaderDSONotFoundError|UnsatisfiedLinkError" logcat.txt | head -80)
            [ -n "$cokme" ] && echo "::error title=Çökme kaydı::$(printf '%s' "$cokme" | kacis)"
            js=$(grep -E "ReactNativeJS|ReactNative|Expo|unknown:" logcat.txt | grep -v -E "^\s*$" | tail -40)
            [ -n "$js" ] && echo "::warning title=Uygulama kaydı::$(printf '%s' "$js" | kacis)"
          fi
          if [ -f ekran.xml ]; then
            yazi=$(grep -o 'text="[^"]*"' ekran.xml | grep -v 'text=""' | head -30 | tr '\n' ' ')
            echo "::notice title=Ekrandaki yazılar::$yazi"
          fi
          if [ -f sonuc.txt ] || [ ! -f pid.txt ]; then exit 1; fi

  # Yalnız açılış testini geçen APK Releases bölümüne konur
  yayinla:
    needs: acilis-testi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: okindo-apk

      - name: APK'yı Releases bölümüne koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" okindo.apk \
            --repo "${{ github.repository }}" \
            --title "okindo APK #${{ github.run_number }}" \
            --notes "Sanal telefonda açılış testini geçti. Telefona kurmak için aşağıdaki okindo.apk dosyasına dokun." \
            --latest
