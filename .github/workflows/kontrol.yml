name: Kontrol

# Her değişiklikte hızlı kontroller (birkaç dakika): tip kontrolü, lint, birim testleri,
# veritabanı senaryo testleri ve sunucu fonksiyonlarının tip kontrolü.
# Biri kırmızıysa değişiklik ana dala alınmadan düzeltilmeli.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: kontrol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uygulama:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Paket sürümleri Expo ile uyumlu mu
        run: npx expo install --check
      - name: Tip kontrolü
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint --max-warnings 0
      - name: Birim testleri
        run: npx jest --ci

  veritabani:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Senaryo testleri
        run: ./tests/testleri_calistir.sh

  sunucu-fonksiyonlari:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3
      - name: Tip kontrolü
        working-directory: supabase/functions
        run: deno check */index.ts
